version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - 'eslint-plugin-*'
          - typescript-eslint
      test-and-build:
        patterns:
          - vite
          - vitest
          - '@vitejs/*'
          - '@vitest/*'
